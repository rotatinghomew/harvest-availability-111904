[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-commitment"
version = "0.1.0"
description = "园地逐日可采量预测与排车前收货承诺"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scipy==1.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
